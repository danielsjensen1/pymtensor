[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymtensor"
version = "1.0.0"
description = "Material tensor package for computing unique tensor elements for arbitrary crystallographic point groups"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Daniel Jensen", email = "dsjense@sandia.gov" }
]
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.6",
    "sympy>=1.7",
    "psutil",
]

[project.optional-dependencies]
speed = ["gmpy2"]

[project.urls]
Homepage = "https://github.com/danielsjensen1/pymtensor"
Repository = "https://github.com/danielsjensen1/pymtensor"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymtensor*"]
